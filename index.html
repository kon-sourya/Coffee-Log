<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BrewLog - Coffee Tracker</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BrewLog">

  <!-- Embedded Web App Manifest for Native Install -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"BrewLog","short_name":"BrewLog","start_url":".","display":"standalone","background_color":"#09090b","theme_color":"#09090b","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brew: {
              50: '#fffbe1', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 900: '#451a03'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { user-select: none; -webkit-tap-highlight-color: transparent; }
    input, select, textarea { font-size: 16px !important; } /* Prevents mobile zoom on focus */
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans antialiased pb-20">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-zinc-900/80 backdrop-blur-md border-b border-zinc-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-xl">☕</span>
      <h1 class="font-bold text-lg text-amber-500 tracking-wide">BrewLog</h1>
    </div>
    <div id="db-status" class="text-xs bg-zinc-800 text-zinc-400 px-2 py-1 rounded-full border border-zinc-700">
      IndexedDB Ready
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-content" class="flex-1 p-4 max-w-md mx-auto w-full">

    <!-- TAB 1: BREW LOGGER -->
    <section id="view-brew" class="space-y-4">
      <h2 class="text-lg font-bold text-amber-400">Log a Brew</h2>
      <form id="form-brew" class="space-y-4">

        <!-- Custom Brew Name -->
        <div>
          <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Recipe / Custom Name</label>
          <input type="text" id="brew-custom-name" placeholder="e.g. Morning Iced V60, Japanese Flash Brew..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:border-amber-500 focus:outline-none">
        </div>

        <!-- Brew Type Toggle (Hot vs Iced) -->
        <div>
          <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Brew Temperature Style</label>
          <div class="grid grid-cols-2 gap-2 bg-zinc-900 p-1 rounded-lg border border-zinc-800">
            <button type="button" id="btn-style-hot" class="py-2 text-xs font-bold rounded-md transition-colors bg-amber-600 text-zinc-950">🔥 Hot Brew</button>
            <button type="button" id="btn-style-iced" class="py-2 text-xs font-bold rounded-md transition-colors text-zinc-400 hover:text-zinc-200">🧊 Iced Brew</button>
          </div>
          <input type="hidden" id="brew-style" value="hot">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Coffee Bean</label>
          <select id="brew-bean" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:border-amber-500 focus:outline-none" required>
            <option value="">Select Bean...</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Brewer</label>
            <select id="brew-equipment" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:border-amber-500 focus:outline-none">
              <option value="V60 Pour Over">V60 Pour Over</option>
              <option value="AeroPress">AeroPress</option>
              <option value="Timemore Crystal Eye">Timemore Crystal Eye</option>
              <option value="French Press">French Press</option>
              <option value="Espresso">Espresso</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Grinder</label>
            <input type="text" id="brew-grinder" placeholder="e.g. Timemore C3S" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:border-amber-500 focus:outline-none">
          </div>
        </div>

        <!-- Dynamic Dose & Water Inputs -->
        <div id="liquid-inputs-container" class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Dose (g)</label>
            <input type="number" step="0.1" id="brew-dose" value="18" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:border-amber-500 focus:outline-none" required>
          </div>
          <div id="field-water-hot">
            <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Water (g)</label>
            <input type="number" step="1" id="brew-water" value="300" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:border-amber-500 focus:outline-none" required>
          </div>
          <div id="field-ice" class="hidden">
            <label class="block text-xs font-semibold font-bold text-cyan-400 uppercase tracking-wider mb-1">Ice (g)</label>
            <input type="number" step="1" id="brew-ice" value="120" class="w-full bg-zinc-900 border border-cyan-900/50 text-cyan-300 rounded-lg p-2.5 focus:border-cyan-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Ratio</label>
            <div id="brew-ratio-display" class="w-full bg-zinc-900/50 border border-zinc-800/80 rounded-lg p-2.5 text-amber-400 font-mono text-center font-bold">
              1:16.7
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Grind Setting</label>
            <input type="text" id="brew-grind-size" placeholder="e.g. 15 clicks / Medium" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:border-amber-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Temp (°C)</label>
            <input type="number" id="brew-temp" value="93" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:border-amber-500 focus:outline-none">
          </div>
        </div>

        <!-- Pours Section -->
        <fieldset class="border border-zinc-800 rounded-lg p-4 space-y-3 bg-zinc-900/30">
          <div class="flex justify-between items-center">
            <legend class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Pours</legend>
            <button type="button" id="btn-add-pour" class="text-xs bg-zinc-800 text-amber-400 px-2 py-1 rounded hover:bg-zinc-700 border border-zinc-700">
              + Add Pour
            </button>
          </div>
          <div id="pours-container" class="space-y-2">
            <!-- Dynamic pour rows -->
          </div>
        </fieldset>

        <!-- Reflection Section -->
        <fieldset class="border border-zinc-800 rounded-lg p-4 space-y-3 bg-zinc-900/30">
          <legend class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Reflection</legend>
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div>
              <label class="block text-zinc-400 mb-1">Taste (1-5)</label>
              <input type="number" id="reflection-taste" min="1" max="5" value="5" class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-100 focus:border-amber-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-zinc-400 mb-1">Acidity (1-5)</label>
              <input type="number" id="reflection-acidity" min="1" max="5" value="2" class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-100 focus:border-amber-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-zinc-400 mb-1">Sweetness (1-5)</label>
              <input type="number" id="reflection-sweetness" min="1" max="5" value="4" class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-100 focus:border-amber-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-zinc-400 mb-1">Bitterness (1-5)</label>
              <input type="number" id="reflection-bitterness" min="1" max="5" value="1" class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-100 focus:border-amber-500 focus:outline-none">
            </div>
          </div>
        </fieldset>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Overall Rating</label>
          <div id="rating-stars" class="flex gap-2 text-2xl text-zinc-600 cursor-pointer">
            <span data-star="1">★</span>
            <span data-star="2">★</span>
            <span data-star="3">★</span>
            <span data-star="4">★</span>
            <span data-star="5">★</span>
          </div>
          <input type="hidden" id="brew-rating" value="0">
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Tasting Notes</label>
          <textarea id="brew-notes" rows="2" placeholder="Bright acidity, jasmine floral notes, clean finish..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:border-amber-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold py-3 rounded-lg transition-colors">
          Save Brew Log
        </button>
      </form>
    </section>

    <!-- TAB 2: BREW HISTORY -->
    <section id="view-history" class="space-y-4 hidden">
      <h2 class="text-lg font-bold text-amber-400">Brew History</h2>
      <input type="text" id="search-history" placeholder="Search title, notes, beans, roaster..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-xs text-zinc-100 focus:border-amber-500 focus:outline-none">
      <div id="history-list" class="space-y-3">
        <!-- Rendered Brew Cards -->
      </div>
    </section>

    <!-- TAB 3: BEANS CATALOG -->
    <section id="view-beans" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-amber-400">Beans Catalog</h2>
        <button id="btn-show-add-bean" class="text-xs bg-amber-600 text-zinc-950 px-3 py-1.5 rounded-lg font-bold hover:bg-amber-500">+ Add Bean</button>
      </div>

      <form id="form-bean" class="space-y-3 bg-zinc-900 border border-zinc-800 rounded-lg p-4 hidden">
        <h3 class="text-sm font-semibold text-zinc-300">New Bean Entry</h3>
        <input type="text" id="bean-name" placeholder="Bean Name (e.g. Karadibetta Estate)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs" required>
        <input type="text" id="bean-roaster" placeholder="Roaster (e.g. Blue Tokai)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs" required>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-zinc-400 mb-1">Roast Date</label>
            <input type="date" id="bean-roast-date" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs" required>
          </div>
          <div>
            <label class="block text-[10px] text-zinc-400 mb-1">Roast Profile</label>
            <select id="bean-roast-level" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs">
              <option value="Light">Light</option>
              <option value="Medium-Light">Medium-Light</option>
              <option value="Medium">Medium</option>
              <option value="Medium-Dark">Medium-Dark</option>
              <option value="Dark">Dark</option>
            </select>
          </div>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="flex-1 bg-amber-600 text-zinc-950 font-bold py-2 rounded text-xs">Save Bean</button>
          <button type="button" id="btn-cancel-bean" class="bg-zinc-800 text-zinc-400 font-bold px-3 py-2 rounded text-xs">Cancel</button>
        </div>
      </form>

      <div id="beans-list" class="space-y-3">
        <!-- Rendered Beans -->
      </div>
    </section>

    <!-- TAB 4: GEAR CATALOG -->
    <section id="view-gear" class="space-y-4 hidden">
      <h2 class="text-lg font-bold text-amber-400">Equipment Catalog</h2>
      <form id="form-gear" class="space-y-3 bg-zinc-900 border border-zinc-800 rounded-lg p-4">
        <input type="text" id="gear-name" placeholder="Equipment Name (e.g. Timemore C3S)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs" required>
        <select id="gear-type" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs">
          <option value="Grinder">Grinder</option>
          <option value="Brewer">Brewer</option>
          <option value="Kettle">Kettle</option>
          <option value="Scale">Scale</option>
          <option value="Filter">Filter Paper / Accessory</option>
        </select>
        <button type="submit" class="w-full bg-amber-600 text-zinc-950 font-bold py-2 rounded text-xs">Add Equipment</button>
      </form>

      <div id="gear-list" class="space-y-2">
        <!-- Rendered Gear -->
      </div>
    </section>

    <!-- TAB 5: DATA MANAGEMENT -->
    <section id="view-data" class="space-y-4 hidden">
      <h2 class="text-lg font-bold text-amber-400">Data & Backup</h2>
      <p class="text-xs text-zinc-400">All data is stored locally in your browser's IndexedDB. Export regular JSON backups to prevent data loss.</p>
      
      <div class="space-y-2">
        <button id="btn-export" class="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-amber-400 font-semibold py-2.5 rounded-lg text-xs flex items-center justify-center gap-2">
          <span>📥</span> Export JSON Backup
        </button>
        <label class="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 font-semibold py-2.5 rounded-lg text-xs flex items-center justify-center gap-2 cursor-pointer">
          <span>📤</span> Import JSON Backup
          <input type="file" id="file-import" accept=".json" class="hidden">
        </label>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-zinc-900/90 backdrop-blur-md border-t border-zinc-800 flex justify-around py-2 text-[10px] z-50">
    <button data-tab="view-brew" class="nav-btn flex flex-col items-center text-amber-500 font-medium">
      <span class="text-lg">☕</span> Brew
    </button>
    <button data-tab="view-history" class="nav-btn flex flex-col items-center text-zinc-400 font-medium">
      <span class="text-lg">📜</span> History
    </button>
    <button data-tab="view-beans" class="nav-btn flex flex-col items-center text-zinc-400 font-medium">
      <span class="text-lg">🫘</span> Beans
    </button>
    <button data-tab="view-gear" class="nav-btn flex flex-col items-center text-zinc-400 font-medium">
      <span class="text-lg">⚙️</span> Gear
    </button>
    <button data-tab="view-data" class="nav-btn flex flex-col items-center text-zinc-400 font-medium">
      <span class="text-lg">💾</span> Data
    </button>
  </nav>

  <!-- Application Logic -->
  <script>
    // --- IndexedDB Database Setup ---
    let db;
    const request = indexedDB.open('BrewLogDB', 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('beans')) db.createObjectStore('beans', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('gear')) db.createObjectStore('gear', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('brews')) db.createObjectStore('brews', { keyPath: 'id', autoIncrement: true });
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      document.getElementById('db-status').innerText = 'IndexedDB Ready';
      seedDefaultsIfEmpty();
      loadBeansDropdown();
      renderBeans();
      renderGear();
      renderHistory();
    };

    request.onerror = () => {
      document.getElementById('db-status').innerText = 'DB Error';
    };

    // --- Hot vs Iced Toggle Logic ---
    const btnHot = document.getElementById('btn-style-hot');
    const btnIced = document.getElementById('btn-style-iced');
    const brewStyleInput = document.getElementById('brew-style');
    const fieldIce = document.getElementById('field-ice');
    const liquidContainer = document.getElementById('liquid-inputs-container');
    const waterInput = document.getElementById('brew-water');
    const iceInput = document.getElementById('brew-ice');

    btnHot.addEventListener('click', () => {
      brewStyleInput.value = 'hot';
      btnHot.className = 'py-2 text-xs font-bold rounded-md transition-colors bg-amber-600 text-zinc-950';
      btnIced.className = 'py-2 text-xs font-bold rounded-md transition-colors text-zinc-400 hover:text-zinc-200';
      fieldIce.classList.add('hidden');
      liquidContainer.className = 'grid grid-cols-3 gap-2';
      waterInput.value = '300';
      calculateRatio();
    });

    btnIced.addEventListener('click', () => {
      brewStyleInput.value = 'iced';
      btnIced.className = 'py-2 text-xs font-bold rounded-md transition-colors bg-cyan-600 text-zinc-950';
      btnHot.className = 'py-2 text-xs font-bold rounded-md transition-colors text-zinc-400 hover:text-zinc-200';
      fieldIce.classList.remove('hidden');
      liquidContainer.className = 'grid grid-cols-4 gap-2';
      waterInput.value = '180';
      calculateRatio();
    });

    // --- Dynamic Pour Row Management ---
    const poursContainer = document.getElementById('pours-container');
    const btnAddPour = document.getElementById('btn-add-pour');

    function addPourRow(amount = '', technique = 'Spiral', time = '0:00') {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2 pour-row';
      row.innerHTML = `
        <input type="number" placeholder="ml" value="${amount}" class="pour-amount w-1/3 bg-zinc-900 border border-zinc-800 rounded p-1.5 text-xs text-zinc-100">
        <select class="pour-technique w-1/3 bg-zinc-900 border border-zinc-800 rounded p-1.5 text-xs text-zinc-100">
          <option value="Bloom" ${technique === 'Bloom' ? 'selected' : ''}>Bloom</option>
          <option value="Spiral" ${technique === 'Spiral' ? 'selected' : ''}>Spiral</option>
          <option value="Center" ${technique === 'Center' ? 'selected' : ''}>Center</option>
        </select>
        <input type="text" placeholder="0:00" value="${time}" class="pour-time w-1/4 bg-zinc-900 border border-zinc-800 rounded p-1.5 text-xs text-zinc-100 text-center">
        <button type="button" onclick="this.parentElement.remove()" class="text-zinc-500 hover:text-red-400 px-1">&times;</button>
      `;
      poursContainer.appendChild(row);
    }

    // Default initial pour rows
    addPourRow(50, 'Bloom', '0:00');
    addPourRow(60, 'Spiral', '0:30');

    btnAddPour.addEventListener('click', () => addPourRow());

    function getPoursData() {
      const rows = document.querySelectorAll('.pour-row');
      return Array.from(rows).map(row => ({
        amount: row.querySelector('.pour-amount').value,
        technique: row.querySelector('.pour-technique').value,
        time: row.querySelector('.pour-time').value
      }));
    }

    function getReflectionData() {
      return {
        taste: parseInt(document.getElementById('reflection-taste').value) || 0,
        acidity: parseInt(document.getElementById('reflection-acidity').value) || 0,
        sweetness: parseInt(document.getElementById('reflection-sweetness').value) || 0,
        bitterness: parseInt(document.getElementById('reflection-bitterness').value) || 0
      };
    }

    // --- Seed Default Data ---
    function seedDefaultsIfEmpty() {
      const tx = db.transaction(['beans'], 'readonly');
      const store = tx.objectStore('beans');
      const countReq = store.count();
      countReq.onsuccess = () => {
        if (countReq.result === 0) {
          const addTx = db.transaction(['beans', 'gear'], 'readwrite');
          addTx.objectStore('beans').add({
            name: 'House Blend',
            roaster: 'Default Roaster',
            roastDate: new Date().toISOString().split('T')[0],
            roastLevel: 'Medium'
          });
          addTx.objectStore('gear').add({ name: 'V60 Dripper', type: 'Brewer' });
          addTx.objectStore('gear').add({ name: 'Manual Grinder', type: 'Grinder' });
        }
      };
    }

    // --- Tab Navigation ---
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-amber-500', 'text-zinc-400'));
        btn.classList.replace('text-zinc-400', 'text-amber-500');

        document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
        const activeTab = btn.getAttribute('data-tab');
        document.getElementById(activeTab).classList.remove('hidden');

        if (activeTab === 'view-brew') loadBeansDropdown();
        if (activeTab === 'view-history') renderHistory();
        if (activeTab === 'view-beans') renderBeans();
        if (activeTab === 'view-gear') renderGear();
      });
    });

    // --- Dynamic Ratio Calculation (Supports Hot & Iced Liquid Split) ---
    const doseInput = document.getElementById('brew-dose');
    const ratioDisplay = document.getElementById('brew-ratio-display');

    function calculateRatio() {
      const dose = parseFloat(doseInput.value) || 0;
      const hotWater = parseFloat(waterInput.value) || 0;
      const ice = brewStyleInput.value === 'iced' ? (parseFloat(iceInput.value) || 0) : 0;
      const totalLiquid = hotWater + ice;

      if (dose > 0 && totalLiquid > 0) {
        ratioDisplay.innerText = `1:${(totalLiquid / dose).toFixed(1)}`;
      } else {
        ratioDisplay.innerText = '1:--';
      }
    }

    doseInput.addEventListener('input', calculateRatio);
    waterInput.addEventListener('input', calculateRatio);
    iceInput.addEventListener('input', calculateRatio);

    // --- Interactive Star Rating ---
    const starsContainer = document.getElementById('rating-stars');
    const ratingInput = document.getElementById('brew-rating');

    starsContainer.addEventListener('click', (e) => {
      if (e.target.dataset.star) {
        const rating = parseInt(e.target.dataset.star);
        ratingInput.value = rating;
        Array.from(starsContainer.children).forEach((star, index) => {
          star.classList.toggle('text-amber-400', index < rating);
          star.classList.toggle('text-zinc-600', index >= rating);
        });
      }
    });

    // --- Beans Operations ---
    function loadBeansDropdown() {
      const tx = db.transaction('beans', 'readonly');
      const store = tx.objectStore('beans');
      const req = store.getAll();
      req.onsuccess = () => {
        const select = document.getElementById('brew-bean');
        select.innerHTML = '<option value="">Select Bean...</option>';
        req.result.forEach(bean => {
          select.innerHTML += `<option value="${bean.name} (${bean.roaster})">${bean.name} - ${bean.roaster}</option>`;
        });
      };
    }

    document.getElementById('btn-show-add-bean').addEventListener('click', () => {
      document.getElementById('form-bean').classList.remove('hidden');
    });
    document.getElementById('btn-cancel-bean').addEventListener('click', () => {
      document.getElementById('form-bean').classList.add('hidden');
    });

    document.getElementById('form-bean').addEventListener('submit', (e) => {
      e.preventDefault();
      const newBean = {
        name: document.getElementById('bean-name').value,
        roaster: document.getElementById('bean-roaster').value,
        roastDate: document.getElementById('bean-roast-date').value,
        roastLevel: document.getElementById('bean-roast-level').value
      };
      const tx = db.transaction('beans', 'readwrite');
      tx.objectStore('beans').add(newBean);
      tx.oncomplete = () => {
        document.getElementById('form-bean').reset();
        document.getElementById('form-bean').classList.add('hidden');
        renderBeans();
      };
    });

    function renderBeans() {
      const tx = db.transaction('beans', 'readonly');
      const store = tx.objectStore('beans');
      const req = store.getAll();
      req.onsuccess = () => {
        const container = document.getElementById('beans-list');
        container.innerHTML = '';
        req.result.forEach(bean => {
          const roast = new Date(bean.roastDate);
          const now = new Date();
          const restDays = Math.floor((now - roast) / (1000 * 60 * 60 * 24));
          container.innerHTML += `
            <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 flex justify-between items-center">
              <div>
                <div class="text-xs uppercase font-bold text-zinc-500">${bean.roaster}</div>
                <div class="font-bold text-sm text-amber-400">${bean.name}</div>
                <div class="text-[11px] text-zinc-400 mt-1 flex items-center gap-2">
                  <span>🗓️ ${bean.roastDate}</span>
                  <span class="bg-amber-950 text-amber-300 border border-amber-800 px-1.5 py-0.5 rounded font-mono">${restDays} days rest</span>
                </div>
              </div>
              <button onclick="deleteEntry('beans', ${bean.id})" class="text-zinc-600 hover:text-red-400">🗑️</button>
            </div>
          `;
        });
      };
    }

    // --- Gear Operations ---
    document.getElementById('form-gear').addEventListener('submit', (e) => {
      e.preventDefault();
      const gear = {
        name: document.getElementById('gear-name').value,
        type: document.getElementById('gear-type').value
      };
      const tx = db.transaction('gear', 'readwrite');
      tx.objectStore('gear').add(gear);
      tx.oncomplete = () => {
        document.getElementById('form-gear').reset();
        renderGear();
      };
    });

    function renderGear() {
      const tx = db.transaction('gear', 'readonly');
      const store = tx.objectStore('gear');
      const req = store.getAll();
      req.onsuccess = () => {
        const container = document.getElementById('gear-list');
        container.innerHTML = '';
        req.result.forEach(item => {
          container.innerHTML += `
            <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 flex justify-between items-center">
              <div>
                <span class="text-[10px] bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded uppercase font-semibold">${item.type}</span>
                <div class="text-xs font-semibold text-zinc-200 mt-1">${item.name}</div>
              </div>
              <button onclick="deleteEntry('gear', ${item.id})" class="text-zinc-600 hover:text-red-400">🗑️</button>
            </div>
          `;
        });
      };
    }

    // --- Brew Logging & History Operations ---
    document.getElementById('form-brew').addEventListener('submit', (e) => {
      e.preventDefault();
      const style = brewStyleInput.value;
      const hotWater = parseFloat(waterInput.value) || 0;
      const ice = style === 'iced' ? (parseFloat(iceInput.value) || 0) : 0;

      const brew = {
        timestamp: new Date().toISOString(),
        customName: document.getElementById('brew-custom-name').value.trim(),
        style: style,
        bean: document.getElementById('brew-bean').value,
        equipment: document.getElementById('brew-equipment').value,
        grinder: document.getElementById('brew-grinder').value,
        dose: parseFloat(doseInput.value),
        water: hotWater,
        ice: ice,
        totalLiquid: hotWater + ice,
        ratio: ratioDisplay.innerText,
        grindSize: document.getElementById('brew-grind-size').value,
        temp: document.getElementById('brew-temp').value,
        rating: parseInt(ratingInput.value),
        notes: document.getElementById('brew-notes').value,
        pours: getPoursData(),
        reflection: getReflectionData()
      };

      const tx = db.transaction('brews', 'readwrite');
      tx.objectStore('brews').add(brew);
      tx.oncomplete = () => {
        document.getElementById('form-brew').reset();
        ratingInput.value = '0';
        Array.from(starsContainer.children).forEach(s => s.classList.replace('text-amber-400', 'text-zinc-600'));
        poursContainer.innerHTML = '';
        addPourRow(50, 'Bloom', '0:00');
        addPourRow(60, 'Spiral', '0:30');
        btnHot.click(); // Reset to Hot default
        alert('Brew logged successfully!');
      };
    });

    function renderHistory(filterQuery = '') {
      const tx = db.transaction('brews', 'readonly');
      const store = tx.objectStore('brews');
      const req = store.getAll();
      req.onsuccess = () => {
        const container = document.getElementById('history-list');
        container.innerHTML = '';
        
        let brews = req.result.reverse();
        if (filterQuery) {
          brews = brews.filter(b => 
            (b.customName && b.customName.toLowerCase().includes(filterQuery)) ||
            (b.bean && b.bean.toLowerCase().includes(filterQuery)) ||
            (b.notes && b.notes.toLowerCase().includes(filterQuery)) ||
            (b.equipment && b.equipment.toLowerCase().includes(filterQuery))
          );
        }

        if (brews.length === 0) {
          container.innerHTML = `<div class="text-center text-xs text-zinc-500 py-8">No brew history found.</div>`;
          return;
        }

        brews.forEach(brew => {
          const dateStr = new Date(brew.timestamp).toLocaleDateString(undefined, {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });

          const stars = '★'.repeat(brew.rating || 0) + '☆'.repeat(5 - (brew.rating || 0));
          const reflection = brew.reflection || { taste: 0, acidity: 0, sweetness: 0, bitterness: 0 };
          const isIced = brew.style === 'iced';

          const reflectionHTML = `
            <div class="mt-3 pt-3 border-t border-zinc-800/80 space-y-1.5 text-xs">
              <div class="text-zinc-400 font-semibold mb-1">Reflection</div>
              ${['taste', 'acidity', 'sweetness', 'bitterness'].map(attr => `
                <div class="flex items-center justify-between text-zinc-400">
                  <span class="capitalize w-20 text-[11px]">${attr}</span>
                  <div class="w-full bg-zinc-800 h-1.5 rounded-full mx-2 overflow-hidden">
                    <div class="bg-amber-600 h-full rounded-full" style="width: ${(reflection[attr] / 5) * 100}%"></div>
                  </div>
                  <span class="text-zinc-300 w-6 text-right font-mono text-[11px]">${reflection[attr]}/5</span>
                </div>
              `).join('')}
            </div>
          `;

          const pours = brew.pours || [];
          const poursHTML = pours.length ? `
            <div class="mt-3 pt-3 border-t border-zinc-800/80 space-y-1 text-xs">
              <div class="text-zinc-400 font-semibold mb-1">Pours</div>
              ${pours.map((p, index) => `
                <div class="flex justify-between items-center text-zinc-400 py-0.5 text-[11px]">
                  <span>Pour ${index + 1} <span class="bg-zinc-800 text-amber-300 border border-zinc-700 px-1.5 py-0.5 rounded text-[10px] ml-1">${p.technique}</span></span>
                  <span class="font-mono">${p.amount} ml &middot; ${p.time}</span>
                </div>
              `).join('')}
            </div>
          ` : '';

          const liquidDetail = isIced 
            ? `${brew.water}g hot + ${brew.ice}g ice` 
            : `${brew.water}g water`;

          container.innerHTML += `
            <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] text-zinc-500 font-mono">${dateStr}</span>
                    <span class="text-[10px] px-1.5 py-0.2 rounded font-bold uppercase ${isIced ? 'bg-cyan-950 text-cyan-400 border border-cyan-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
                      ${isIced ? '🧊 Iced' : '🔥 Hot'}
                    </span>
                  </div>
                  ${brew.customName ? `<div class="font-bold text-zinc-100 text-sm mt-1">${brew.customName}</div>` : ''}
                  <div class="font-semibold text-amber-400 text-xs mt-0.5">${brew.bean || 'Unknown Bean'}</div>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-amber-400 text-xs tracking-widest">${stars}</span>
                  <button onclick="deleteEntry('brews', ${brew.id})" class="text-zinc-600 hover:text-red-400 text-xs">🗑️</button>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-1 bg-zinc-950 p-2 rounded text-[10px] font-mono text-zinc-300 border border-zinc-800/50">
                <div><span class="text-zinc-500">Ratio:</span> ${brew.ratio}</div>
                <div><span class="text-zinc-500">Dose:</span> ${brew.dose}g</div>
                <div><span class="text-zinc-500">Liquid:</span> ${liquidDetail}</div>
                <div><span class="text-zinc-500">Grind:</span> ${brew.grindSize || '-'}</div>
                <div><span class="text-zinc-500">Temp:</span> ${brew.temp}°C</div>
                <div><span class="text-zinc-500">Method:</span> ${brew.equipment}</div>
              </div>

              ${poursHTML}
              ${reflectionHTML}

              ${brew.notes ? `<div class="text-xs text-zinc-300 italic pt-1">"${brew.notes}"</div>` : ''}
            </div>
          `;
        });
      };
    }

    document.getElementById('search-history').addEventListener('input', (e) => {
      renderHistory(e.target.value.toLowerCase());
    });

    // --- Delete Utility ---
    window.deleteEntry = function(storeName, id) {
      if (confirm('Delete this entry permanently?')) {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => {
          if (storeName === 'beans') renderBeans();
          if (storeName === 'gear') renderGear();
          if (storeName === 'brews') renderHistory();
        };
      }
    };

    // --- JSON Data Export / Import ---
    document.getElementById('btn-export').addEventListener('click', () => {
      const backup = {};
      const tx = db.transaction(['beans', 'gear', 'brews'], 'readonly');
      
      tx.objectStore('beans').getAll().onsuccess = (e) => backup.beans = e.target.result;
      tx.objectStore('gear').getAll().onsuccess = (e) => backup.gear = e.target.result;
      tx.objectStore('brews').getAll().onsuccess = (e) => backup.brews = e.target.result;

      tx.oncomplete = () => {
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `brewlog-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };
    });

    document.getElementById('file-import').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          const tx = db.transaction(['beans', 'gear', 'brews'], 'readwrite');
          
          if (data.beans) data.beans.forEach(item => tx.objectStore('beans').put(item));
          if (data.gear) data.gear.forEach(item => tx.objectStore('gear').put(item));
          if (data.brews) data.brews.forEach(item => tx.objectStore('brews').put(item));

          tx.oncomplete = () => {
            alert('Data imported successfully!');
            renderBeans();
            renderGear();
            renderHistory();
          };
        } catch (err) {
          alert('Invalid JSON file format.');
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
